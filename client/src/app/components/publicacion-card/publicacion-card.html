<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-4 hover:shadow-md transition">
  <div class="flex justify-between items-start mb-3">
    <div class="flex items-center gap-3">
      <img [src]="publicacion.autor?.imagenPerfil || 'https://ui-avatars.com/api/?name=' + publicacion.autor?.nombre" 
           alt="avatar" 
           class="w-10 h-10 rounded-full object-cover border border-gray-200">
      <div>
        <p class="font-semibold text-gray-900 text-sm">
          {{ publicacion.autor?.nombre }} {{ publicacion.autor?.apellido }}
        </p>
        <p class="text-xs text-gray-500">@{{ publicacion.autor?.nombreUsuario }} • {{ publicacion.createdAt | date:'short' }}</p>
      </div>
    </div>

    @if (usuarioActualId === publicacion.autor?._id) {
      <button (click)="onEliminar()" class="text-gray-400 hover:text-red-500 transition" title="Eliminar publicación">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
      </button>
    }
  </div>

  <h3 class="text-lg font-bold text-gray-800 mb-1">{{ publicacion.titulo }}</h3>
  <p class="text-gray-700 text-sm mb-3">{{ publicacion.descripcion }}</p>

  @if (publicacion.imagen) {
    <img [src]="publicacion.imagen" alt="Imagen adjunta" class="rounded-lg max-h-80 w-full object-cover mb-3">
  }

  <div class="flex items-center gap-6 mt-4 pt-3 border-t border-gray-50">
    
    <button (click)="toggleLike()" class="flex items-center gap-1.5 transition group" [ngClass]="{'text-red-500': meGusta, 'text-gray-500 hover:text-red-500': !meGusta}">
      <svg class="w-5 h-5 group-active:scale-125 transition-transform" [attr.fill]="meGusta ? 'currentColor' : 'none'" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
      </svg>
      <span class="text-sm font-medium">{{ publicacion.likes?.length || 0 }}</span>
    </button>

    <button class="flex items-center gap-1.5 text-gray-500 hover:text-indigo-500 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
      <span class="text-sm font-medium">{{ publicacion.cantidadComentarios || 0 }}</span>
    </button>
  </div>
</div>
