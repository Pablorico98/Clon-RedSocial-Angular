<router-outlet></router-outlet>

@if (confirmModal.visible()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-50 backdrop-blur-sm px-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 border border-gray-100">

      <div class="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4"
           [class]="confirmModal.opciones().peligro ? 'bg-red-100' : 'bg-yellow-100'">
        @if (confirmModal.opciones().peligro) {
          <svg class="w-7 h-7 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        } @else {
          <svg class="w-7 h-7 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        }
      </div>

      <h2 class="text-lg font-bold text-gray-900 text-center mb-1">{{ confirmModal.opciones().titulo }}</h2>
      <p class="text-gray-500 text-sm text-center mb-6">{{ confirmModal.opciones().mensaje }}</p>

      <div class="flex gap-3">
        <button (click)="confirmModal.cancelar()"
                class="flex-1 px-4 py-2 bg-gray-100 text-gray-700 font-medium rounded-lg hover:bg-gray-200 transition text-sm">
          {{ confirmModal.opciones().textoCancelar ?? 'Cancelar' }}
        </button>
        <button (click)="confirmModal.confirmar()"
                class="flex-1 px-4 py-2 font-medium rounded-lg transition text-sm text-white shadow-sm"
                [class]="confirmModal.opciones().peligro ? 'bg-red-600 hover:bg-red-700' : 'bg-indigo-600 hover:bg-indigo-700'">
          {{ confirmModal.opciones().textoConfirmar ?? 'Confirmar' }}
        </button>
      </div>
    </div>
  </div>
}

@if (mostrarModal) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-50 backdrop-blur-sm px-4 transition-opacity">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 text-center border border-gray-100 transform transition-all scale-100">
      
      <div class="w-16 h-16 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
      </div>
      
      <h2 class="text-xl font-bold text-gray-900 mb-2">Tu sesión está por expirar</h2>
      <p class="text-gray-600 text-sm mb-4">
        Por seguridad, cerraremos tu sesión automáticamente en:
      </p>
      
      <div class="text-4xl font-mono font-bold text-red-600 mb-6 tracking-wider">
        {{ tiempoFormateado }}
      </div>
      
      <div class="flex flex-col sm:flex-row gap-3 justify-center">
        <button (click)="cerrarSesion()" class="w-full sm:w-auto px-4 py-2 bg-gray-100 text-gray-700 font-medium rounded-lg hover:bg-gray-200 transition">
          Cerrar Sesión
        </button>
        <button (click)="extenderSesion()" class="w-full sm:w-auto px-4 py-2 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition shadow-md">
          Mantener conectado
        </button>
      </div>
    </div>
  </div>
}
