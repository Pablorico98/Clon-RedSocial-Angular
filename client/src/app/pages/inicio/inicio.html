<nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10">
  <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
    <h1 class="text-xl font-bold text-indigo-600">Red Social UTN</h1>
    <div class="flex items-center gap-4">
      <a routerLink="/perfil" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition">Mi Perfil</a>
      <button (click)="onLogout()" class="text-sm font-medium text-red-600 hover:text-red-700 transition">Salir</button>
    </div>
  </div>
</nav>

<div class="min-h-screen bg-gray-50 p-4">
  <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-8">
    
    <aside class="md:col-span-1">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 sticky top-20">
        <h2 class="text-lg font-bold text-gray-900 mb-4">Nueva publicación</h2>
        <form [formGroup]="publicacionForm" (ngSubmit)="onCrearPublicacion()" class="space-y-4">
          
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Título</label>
            <input type="text" formControlName="titulo" class="w-full rounded-lg border-gray-300 p-2.5 text-sm bg-gray-50 border focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" placeholder="¿De qué trata?">
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Mensaje</label>
            <textarea formControlName="mensaje" rows="4" class="w-full rounded-lg border-gray-300 p-2.5 text-sm bg-gray-50 border focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none" placeholder="Escribe aquí..."></textarea>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Imagen (Opcional)</label>
            <label class="flex flex-col items-center justify-center w-full h-24 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition">
              <div class="flex flex-col items-center justify-center pt-5 pb-6">
                <svg class="w-8 h-8 mb-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <p class="text-xs text-gray-500">{{ imagenFile ? imagenFile.name : 'Seleccionar archivo' }}</p>
              </div>
              <input type="file" (change)="onFileSelected($event)" accept="image/*" class="hidden">
            </label>
          </div>

          <button type="submit" [disabled]="publicacionForm.invalid || isSubmitting()" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg hover:bg-indigo-700 transition disabled:bg-indigo-300 disabled:cursor-not-allowed text-sm shadow-sm">
            {{ isSubmitting() ? 'Publicando...' : 'Publicar' }}
          </button>
        </form>
      </div>
    </aside>

    <section class="md:col-span-3 space-y-6">
      <div class="flex gap-2">
        <button (click)="cambiarOrden('fecha')" 
                [class]="ordenActual() === 'fecha' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'"
                class="px-5 py-2 rounded-full text-sm font-semibold transition shadow-sm border border-gray-200">
          Más recientes
        </button>
        <button (click)="cambiarOrden('likes')" 
                [class]="ordenActual() === 'likes' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'"
                class="px-5 py-2 rounded-full text-sm font-semibold transition shadow-sm border border-gray-200">
          Más populares
        </button>
      </div>

      <div class="space-y-4">
        @for (pub of publicaciones(); track pub._id) {
          <app-publicacion-card 
            [publicacion]="pub" 
            [usuarioActualId]="usuarioActual?._id"
            (darLike)="onDarLike($event)"
            (quitarLike)="onQuitarLike($event)"
            (eliminar)="onEliminarPub($event)">
          </app-publicacion-card>
        } @empty {
          <div class="text-center py-10 bg-white rounded-xl shadow-sm border border-gray-100">
            <p class="text-gray-500 font-medium text-sm">No hay publicaciones aún.</p>
          </div>
        }
      </div>

      <div class="text-center pt-4 pb-10">
        @if (isLoading()) {
          <p class="text-sm text-gray-500">Cargando...</p>
        } @else if (hasMore()) {
          <button (click)="cargarMas()" class="px-6 py-2 bg-white border border-gray-200 text-indigo-600 font-medium text-sm rounded-full hover:bg-indigo-50 shadow-sm transition">
            Cargar más
          </button>
        }
      </div>
    </section>
  </div>
</div>
