<nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10">
  <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
    <h1 class="text-xl font-bold text-indigo-600">Red Social</h1>
    <div class="flex items-center gap-4">
      <button routerLink="/perfil" class="text-sm font-medium text-gray-600 hover:text-indigo-600">Mi Perfil</button>
      <button (click)="onLogout()" class="text-sm font-medium text-red-600 hover:text-red-700">Salir</button>
    </div>
  </div>
</nav>

<main class="max-w-3xl mx-auto px-4 py-6">
  
  <div class="flex items-center justify-between mb-6 bg-white p-3 rounded-lg shadow-sm border border-gray-100">
    <h2 class="text-lg font-bold text-gray-800">Publicaciones</h2>
    <div class="flex bg-gray-100 rounded-lg p-1">
      <button (click)="cambiarOrden('fecha')" 
              [class.bg-white]="ordenActual() === 'fecha'" 
              [class.shadow-sm]="ordenActual() === 'fecha'"
              class="px-3 py-1.5 text-sm font-medium rounded-md transition text-gray-700">
        Más recientes
      </button>
      <button (click)="cambiarOrden('likes')" 
              [class.bg-white]="ordenActual() === 'likes'" 
              [class.shadow-sm]="ordenActual() === 'likes'"
              class="px-3 py-1.5 text-sm font-medium rounded-md transition text-gray-700">
        Más populares
      </button>
    </div>
  </div>

  <div class="space-y-4">
    @for (pub of publicaciones(); track pub._id) {
      <app-publicacion-card 
        [publicacion]="pub" 
        [usuarioActualId]="usuarioActual?._id"
        (darLike)="onDarLike($event)"
        (quitarLike)="onQuitarLike($event)"
        (eliminar)="onEliminarPub($event)">
      </app-publicacion-card>
    } @empty {
      @if (!isLoading()) {
        <div class="text-center py-10 bg-white rounded-xl shadow-sm border border-gray-100">
          <p class="text-gray-500 font-medium">Aún no hay publicaciones.</p>
        </div>
      }
    }
  </div>

  <div class="mt-6 flex justify-center pb-10">
    @if (isLoading()) {
      <span class="flex items-center gap-2 text-indigo-600 font-medium text-sm">
        <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        Cargando...
      </span>
    } @else if (hasMore()) {
      <button (click)="cargarMas()" class="px-6 py-2 bg-white border border-gray-300 text-gray-700 font-medium text-sm rounded-full hover:bg-gray-50 shadow-sm transition">
        Cargar más publicaciones
      </button>
    } @else if (publicaciones().length > 0) {
      <p class="text-gray-400 text-sm">No hay más publicaciones para mostrar.</p>
    }
  </div>
</main>
