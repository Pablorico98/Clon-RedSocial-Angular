<nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10">
  <div class="max-w-5xl mx-auto px-4 h-14 flex items-center gap-3">
    <a routerLink="/inicio" class="flex items-center gap-1.5 text-sm text-gray-500 hover:text-indigo-600 transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Inicio
    </a>
    <span class="text-gray-300">/</span>
    <span class="text-sm font-semibold text-gray-800">Estadísticas</span>
  </div>
</nav>

<div class="min-h-screen bg-gray-50">
<div class="max-w-5xl mx-auto p-6">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">Estadísticas</h1>

  <div class="bg-white rounded-xl shadow p-4 mb-6 flex flex-wrap items-end gap-4">
    <div>
      <label class="block text-sm font-medium text-gray-600 mb-1">Desde</label>
      <input
        type="date"
        [ngModel]="desde()"
        (ngModelChange)="desde.set($event)"
        class="border rounded-lg px-3 py-2 text-sm"
      />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-600 mb-1">Hasta</label>
      <input
        type="date"
        [ngModel]="hasta()"
        (ngModelChange)="hasta.set($event)"
        class="border rounded-lg px-3 py-2 text-sm"
      />
    </div>
    <button
      (click)="aplicarFiltro()"
      class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm"
    >
      Aplicar
    </button>
  </div>

  <div class="grid grid-cols-1 gap-6">
    <div class="bg-white rounded-xl shadow p-5">
      <h2 class="text-base font-semibold text-gray-700 mb-3">Publicaciones por usuario</h2>
      <canvas #barCanvas></canvas>
    </div>

    <div class="bg-white rounded-xl shadow p-5">
      <h2 class="text-base font-semibold text-gray-700 mb-3">Comentarios por día</h2>
      <canvas #lineCanvas></canvas>
    </div>

    <div class="bg-white rounded-xl shadow p-5">
      <h2 class="text-base font-semibold text-gray-700 mb-3">Comentarios por publicación</h2>
      <canvas #pieCanvas></canvas>
    </div>
  </div>
</div>
</div>
