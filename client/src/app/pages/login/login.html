<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    
    <h2 class="text-2xl font-bold text-center mb-6">Iniciar Sesión</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      
      <div>
        <label class="block text-sm font-medium mb-1">Correo o Nombre de Usuario</label>
        <input type="text" formControlName="identificador" placeholder="pablo@test.com o Pablorico98" class="w-full border rounded p-2 outline-none focus:ring-2 focus:ring-blue-500">
        <span *ngIf="loginForm.get('identificador')?.touched && loginForm.get('identificador')?.invalid" class="text-red-500 text-xs">Este campo es obligatorio.</span>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Contraseña</label>
        <input type="password" formControlName="password" placeholder="••••••••" class="w-full border rounded p-2 outline-none focus:ring-2 focus:ring-blue-500">
        <span *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-red-500 text-xs">Debe tener mínimo 8 caracteres, 1 mayúscula y 1 número.</span>
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-semibold hover:bg-blue-700 transition mt-2">
        Ingresar
      </button>

      <button type="button" (click)="autocompletarDatos()" class="w-full bg-green-500 text-white py-2 rounded font-semibold hover:bg-green-600 transition mt-2">
        Auto-completar Datos (Test)
      </button>

      <p class="text-center text-sm mt-4">
        ¿No tenés cuenta? <a routerLink="/registro" class="text-blue-600 hover:underline font-medium">Registrate acá</a>
      </p>

    </form>
  </div>
</div>
