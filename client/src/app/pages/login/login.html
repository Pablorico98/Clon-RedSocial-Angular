<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Iniciar Sesión</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Usuario o Email</label>
        <input 
          type="text" 
          formControlName="identificador"
          class="w-full mt-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"
          placeholder="Ingrese su identificador"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Contraseña</label>
        <input 
          type="password" 
          formControlName="password"
          class="w-full mt-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"
          placeholder="••••••••"
        >
      </div>

      <button 
        type="submit" 
        [disabled]="loginForm.invalid"
        class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition duration-200 disabled:opacity-50"
      >
        Ingresar
      </button>

      <!-- Botón de ingreso rápido -->
      <button 
        type="button" 
        (click)="fillData()"
        class="w-full bg-gray-200 text-gray-700 font-semibold py-2 rounded-lg hover:bg-gray-300 transition text-sm"
      >
        Ingreso rápido (Auto-fill)
      </button>
    </form>
  </div>
</div>
