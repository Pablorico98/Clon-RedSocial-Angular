<div class="min-h-screen w-full flex items-center justify-center bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 p-2 md:p-6">
  
  <div class="w-full max-w-4xl max-h-[95vh] bg-white rounded-3xl shadow-2xl overflow-y-auto overflow-x-hidden flex flex-col md:flex-row">
    
    <div class="hidden md:flex md:w-1/3 bg-slate-900 p-8 text-white flex-col justify-center space-y-4">
      <h1 class="text-3xl font-black leading-tight">Únete a nuestra comunidad</h1>
      <p class="text-slate-400 text-sm">Completa tus datos y empieza a gestionar tus publicaciones hoy mismo.</p>
    </div>

    <form [formGroup]="registroForm" (ngSubmit)="onRegistro()" class="flex-1 p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
      
      <div class="col-span-1 md:col-span-2">
        <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-0.5">Nombre de Usuario</label>
        <input type="text" formControlName="nombreUsuario" class="w-full p-2.5 bg-slate-100 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 transition outline-none">
      </div>

      <div>
        <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-0.5">Nombre</label>
        <input type="text" formControlName="nombre" class="w-full p-2.5 bg-slate-100 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 transition outline-none">
      </div>

      <div>
        <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-0.5">Apellido</label>
        <input type="text" formControlName="apellido" class="w-full p-2.5 bg-slate-100 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 transition outline-none">
      </div>

      <div class="col-span-1 md:col-span-2">
        <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-0.5">Correo electrónico</label>
        <input type="email" formControlName="correo" class="w-full p-2.5 bg-slate-100 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 transition outline-none">
      </div>

      <div>
        <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-0.5">F. Nacimiento</label>
        <input type="date" formControlName="fechaNacimiento" class="w-full p-2.5 bg-slate-100 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 transition outline-none">
      </div>

      <div>
        <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-0.5">Contraseña</label>
        <input type="password" formControlName="password" class="w-full p-2.5 bg-slate-100 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 transition outline-none">
      </div>

      <div class="col-span-1 md:col-span-2">
        <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-0.5">Descripción</label>
        <textarea formControlName="descripcion" rows="2" class="w-full p-2.5 bg-slate-100 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 transition outline-none"></textarea>
      </div>

      <div class="col-span-1 md:col-span-2 flex items-center justify-between bg-slate-100 p-2 rounded-xl border border-slate-200">
         <span class="text-xs text-gray-500 px-2 font-medium">Foto</span>
         <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" class="hidden">
         <button type="button" (click)="fileInput.click()" class="bg-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm hover:bg-gray-50 transition border border-slate-200">
           {{ selectedFile ? selectedFile.name : 'Subir archivo' }}
         </button>
         <button type="button" *ngIf="selectedFile" (click)="clearFile()" class="text-red-500 hover:text-red-700 px-2 font-bold">✕</button>
      </div>

      <div class="col-span-1 md:col-span-2">
         <button type="submit" [disabled]="registroForm.invalid || isSubmitting"
          class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition duration-300 disabled:bg-gray-400">
          {{ isSubmitting ? 'Registrando...' : 'Crear Cuenta' }}
         </button>
      </div>
      
      <div class="col-span-1 md:col-span-2 text-center text-xs text-gray-500">
        ¿Ya tienes cuenta? <a routerLink="/login" class="text-indigo-600 font-bold hover:underline">Inicia sesión</a>
      </div>

    </form>
  </div>
</div>
